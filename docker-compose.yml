version: '3.8'

services:
  # تطبيق محل العجل (.NET 10)
  bike-shop-api:
    build: .
    container_name: bike_shop_app
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis-cache:6379
    depends_on:
      - redis-cache

  # خدمة Redis
  redis-cache:
    image: redis:alpine
    container_name: redis_container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data: